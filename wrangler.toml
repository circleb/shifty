name = "shifty"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# Shown in the page header.
APP_NAME = "Shift Shaper"
# Public origin. Reminder emails use it for cancel links.
BASE_URL = "https://shiftshaper.io"
# Sender must be verified in Resend. Email is skipped entirely if RESEND_API_KEY is not set.
MAIL_FROM = "Shift Shaper <shifts@shiftshaper.io>"

[[d1_databases]]
binding = "DB"
database_name = "shifty"
# Leave database_id unset. `wrangler deploy` creates this database on the
# connected account and reuses it by name on later deploys.

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[triggers]
# Reminder sweep every 15 minutes.
crons = ["*/15 * * * *"]
